name: Game Stats Worker release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-stats-worker-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release candidate
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/game-stats/package-lock.json
      - name: Install site dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm ci --prefix workers/game-stats
      - name: Run source tests
        run: npm test
      - name: Verify generated integrity metadata
        run: npm run game-stats:integrity:check
      - name: Verify Worker deployment bundle
        run: npm --prefix workers/game-stats run deploy:check

  release:
    name: Release synchronized browser and Worker build
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified release candidate
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/game-stats/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefix workers/game-stats
      - name: Require production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-game-stats-release-context.mjs --credentials
      - name: Wait for checked-in browser release to reach production
        run: npm run game-stats:static-release:check
      - name: Reject a superseded workflow revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-game-stats-release-context.mjs --current-main
      - name: Deploy current Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm --prefix workers/game-stats run deploy --
          --config wrangler.jsonc --strict
      - name: Verify checked-in/deployed browser/Worker release parity
        run: npm run game-stats:release:check
