    <style>
      :root {
        --loader-image: url("assets/mountain-and-sky.png");
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--loader-image) center / cover no-repeat fixed;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--loader-image) center / cover no-repeat;
        z-index: 10;
      }

      .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(0, 60, 90, 0.2));
      }

      .loader-window {
        position: relative;
        z-index: 1;
        width: min(92vw, 460px);
      }

      .window-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .loader-copy {
        margin: 0;
      }

      .progress-indicator {
        height: 18px;
      }

      .progress-indicator-bar {
        width: 0%;
      }

      .status-text {
        margin: 0;
      }

      .action-row {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 6px;
      }

      .alert-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.25);
        z-index: 20;
      }

      .alert-overlay.is-open {
        display: flex;
      }

      .alert-window {
        width: min(90vw, 320px);
      }

      .alert-content {
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 12px;
        align-items: center;
      }

      .alert-content p {
        margin: 0;
      }

      .alert-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }

      @media (max-width: 600px) {
        .loader-window {
          width: min(94vw, 400px);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader" id="loader" aria-live="polite" data-nosnippet>
      <div class="window loader-window">
        <div class="title-bar">
          <div class="title-bar-text">Downloading latest update of Rohin OS</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <p class="loader-copy" id="loader-copy">This website is optimized for desktop. Preparing the environment, Please wait...</p>
          <div
            class="progress-indicator segmented"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span class="progress-indicator-bar" id="progress-bar"></span>
          </div>
          <p class="status-text" id="status-text">Starting...</p>
          <div class="action-row">
            <button id="cancel-button">Cancel</button>
            <button id="proceed-button" class="default" disabled>Proceed</button>
          </div>
        </div>
      </div>
    </div>

    <div class="alert-overlay" id="alert-overlay" aria-hidden="true" data-nosnippet>
      <div class="window alert-window" role="alertdialog" aria-labelledby="alert-title">
        <div class="title-bar">
          <div class="title-bar-text" id="alert-title">System Alert</div>
          <div class="title-bar-controls">
            <button aria-label="Close" id="alert-close"></button>
          </div>
        </div>
        <div class="window-body">
          <div class="alert-content">
            <img src="assets/app-icons/ico/msg_warning.ico" alt="Warning" width="32" height="32" />
            <p>Patience is a virtue.</p>
          </div>
          <div class="alert-actions">
            <button id="alert-ok" class="default">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const progressBar = document.getElementById("progress-bar");
      const progressWrap = document.querySelector(".progress-indicator");
      const statusText = document.getElementById("status-text");
      const loaderCopy = document.getElementById("loader-copy");
      const proceedButton = document.getElementById("proceed-button");
      const cancelButton = document.getElementById("cancel-button");
      const alertOverlay = document.getElementById("alert-overlay");
      const alertOk = document.getElementById("alert-ok");
      const alertClose = document.getElementById("alert-close");
      const loaderClose = document.querySelector('.loader-window .title-bar-controls button[aria-label="Close"]');
      const loaderMinimize = document.querySelector('.loader-window .title-bar-controls button[aria-label="Minimize"]');
      const loaderMaximize = document.querySelector('.loader-window .title-bar-controls button[aria-label="Maximize"]');
      const defaultDocumentTitle =
        document.title ||
        "Rohin OS";
      const awayDocumentTitle = "come back :(";
      const homeWarmupSearch = new URLSearchParams(window.location.search);
      const homeTargetHref =
        homeWarmupSearch.get("prerenderDebug") === "1"
          ? "home.html?prerenderDebug=1"
          : "home.html";
      const loaderPrerenderDebugEnabled =
        homeWarmupSearch.get("prerenderDebug") === "1";
      const supportsSpeculationRules =
        typeof HTMLScriptElement !== "undefined" &&
        typeof HTMLScriptElement.supports === "function" &&
        HTMLScriptElement.supports("speculationrules");
      const loaderWarmupLog = (...args) => {
        if (!loaderPrerenderDebugEnabled) return;
        console.info("[Rohin OS loader warmup]", ...args);
      };
      window.rohinIndexWarmup = {
        homeTargetHref,
        supportsSpeculationRules,
        started: false,
        startedAt: null,
        speculationRuleInjected: false,
        documentPrefetchFallback: false,
      };
      let progress = 0;
      let ticking = false;
      let timerId = null;
      let homeWarmupStarted = false;
      const homeWarmupResources = [
        ["styles/home/base.css?v=calendar-square-stack-20260617", "style"],
        ["styles/home/apps/minesweeper.css?v=minesweeper-mobile-controls-20260724", "style"],
        ["styles/home/apps/solitaire.css", "style"],
        ["styles/home/apps/snake.css", "style"],
        ["styles/home/apps/sudoku.css?v=sudoku-desktop-controls-20260722", "style"],
        ["styles/home/apps/game-stats.css?v=global-leaderboard-launchers-20260725", "style"],
        ["styles/home/apps/life-counter.css?v=counter-project-glow-20260703", "style"],
        ["styles/home/portfolio.css?v=degree-card-spacing-20260728", "style"],
        ["styles/home/study-resources.css", "style"],
        ["styles/home/random-events.css?v=public-info-spacing-20260728", "style"],
        ["styles/home/cursors.css?v=cursor-titlebar-clickable-20260709", "style"],
        ["scripts/home/game-stats-backend.js?v=game-build-46a52e074099899c9b8cade7dbca878bc071f026873f16fb83c87e41b2ddadbd", "script"],
        ["scripts/home/app-icon-manifest.js?v=game-stats-cloudflare-20260721", "script"],
        ["scripts/home/core/dom.js?v=game-build-46a52e074099899c9b8cade7dbca878bc071f026873f16fb83c87e41b2ddadbd", "script"],
        ["scripts/home/core/media.js?v=media-priority-loader-20260723", "script"],
        ["scripts/home/main.js?v=game-build-46a52e074099899c9b8cade7dbca878bc071f026873f16fb83c87e41b2ddadbd", "script"],
      ];

      const addHomeWarmupPrefetch = ([href, as]) => {
        if (document.head.querySelector(`link[rel="prefetch"][href="${href}"]`)) return;
        const link = document.createElement("link");
        link.rel = "prefetch";
        link.href = href;
        link.as = as;
        document.head.append(link);
      };

      const addHomeDocumentPrefetchFallback = () => {
        window.rohinIndexWarmup.documentPrefetchFallback = true;
        loaderWarmupLog("document prefetch fallback", { homeTargetHref });
        addHomeWarmupPrefetch([homeTargetHref, "document"]);
      };

      const addHomePrerenderRule = () => {
        if (document.querySelector('script[type="speculationrules"][data-home-prerender]')) return;
        const script = document.createElement("script");
        script.type = "speculationrules";
        script.dataset.homePrerender = "true";
        script.textContent = JSON.stringify({
          prerender: [
            {
              urls: [homeTargetHref],
              eagerness: "immediate",
            },
          ],
        });
        document.head.append(script);
        window.rohinIndexWarmup.speculationRuleInjected = true;
        loaderWarmupLog("speculation rule injected", {
          homeTargetHref,
          supportsSpeculationRules,
        });
      };

      const startHomeWarmup = () => {
        if (homeWarmupStarted) return;
        homeWarmupStarted = true;
        window.rohinIndexWarmup.started = true;
        window.rohinIndexWarmup.startedAt = Math.round(performance.now());
        addHomePrerenderRule();
        if (!supportsSpeculationRules) {
          addHomeDocumentPrefetchFallback();
        }
        homeWarmupResources.forEach(addHomeWarmupPrefetch);
        loaderWarmupLog("subresource prefetches added", {
          count: homeWarmupResources.length,
          startedAt: window.rohinIndexWarmup.startedAt,
        });
      };

      const scheduleHomeWarmup = () => {
        requestAnimationFrame(() => {
          requestAnimationFrame(startHomeWarmup);
        });
      };

      const tick = () => {
        ticking = true;
        const slowDown = progress > 70 ? 4 : 0;
        const delta = Math.max(0, Math.random() * 9 + 2 - slowDown);
        progress = Math.min(progress + delta, 100);
        progressBar.style.width = `${progress}%`;
        progressWrap.setAttribute("aria-valuenow", Math.floor(progress));
        statusText.textContent = `Loading... ${Math.floor(progress)}%`;

        if (progress < 100) {
          const jitter = 160 + Math.random() * 320;
          timerId = setTimeout(tick, jitter);
        } else {
          ticking = false;
          loaderCopy.textContent = "Welcome!";
          statusText.textContent = "Ready. Click Proceed to continue.";
          proceedButton.disabled = false;
          cancelButton.disabled = true;
        }
      };

      const resetLoader = () => {
        if (timerId) {
          clearTimeout(timerId);
          timerId = null;
        }
        document.body.classList.remove("loaded");
        progress = 0;
        progressBar.style.width = "0%";
        progressWrap.setAttribute("aria-valuenow", "0");
        loaderCopy.innerHTML =
          "This website is optimized for desktop. Preparing the environment...";
        statusText.textContent = "Starting...";
        proceedButton.disabled = true;
        cancelButton.disabled = false;
        ticking = false;
      };

      const startLoader = () => {
        if (ticking) {
          return;
        }
        resetLoader();
        scheduleHomeWarmup();
        timerId = setTimeout(tick, 300);
      };

      document.addEventListener("DOMContentLoaded", startLoader);

      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          startLoader();
        }
      });

      document.addEventListener("visibilitychange", () => {
        document.title = document.hidden ? awayDocumentTitle : defaultDocumentTitle;
      });

      proceedButton.addEventListener("click", () => {
        statusText.textContent = "Proceeding...";
        proceedButton.disabled = true;
        cancelButton.disabled = true;
        window.location.href = homeTargetHref;
      });

      cancelButton.addEventListener("click", () => {
        alertOverlay.classList.add("is-open");
        alertOverlay.setAttribute("aria-hidden", "false");
      });

      const closeAlert = () => {
        alertOverlay.classList.remove("is-open");
        alertOverlay.setAttribute("aria-hidden", "true");
      };

      alertOk.addEventListener("click", closeAlert);
      alertClose.addEventListener("click", closeAlert);

      if (loaderClose) {
        loaderClose.addEventListener("click", () => {
          window.location.reload();
        });
      }

      const skipToHome = () => {
        window.location.href = homeTargetHref;
      };

      const handleLoaderControl = () => {
        if (progress >= 100) {
          window.location.reload();
          return;
        }
        skipToHome();
      };

      if (loaderMinimize) {
        loaderMinimize.addEventListener("click", handleLoaderControl);
      }

      if (loaderMaximize) {
        loaderMaximize.addEventListener("click", handleLoaderControl);
      }
    </script>
  </body>
