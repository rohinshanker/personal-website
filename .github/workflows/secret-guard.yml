name: Secret guard

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guard:
    name: Check source files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      # tests/no-secrets.test.mjs re-scans the same tree; it stays in `npm test`
      # so a push does not pay for the scan twice.
      - name: Scan tracked source for secrets
        run: node scripts/check-no-secrets.mjs

  gitleaks:
    name: Scan reachable Git history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history for secrets
        # gitleaks/gitleaks-action v2.3.9
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
