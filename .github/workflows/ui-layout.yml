name: Browser UI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Layout, behaviour, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: test-results/
          if-no-files-found: ignore

  visual:
    name: Visual baselines
    # Baselines are committed for linux/arm64, the platform
    # scripts/run-visual-tests.mjs renders in. Keep this runner architecture and
    # that container platform in step.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Browsers and dependencies both come from the pinned container, so the
      # runner installs nothing.
      - run: npm run test:visual
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: test-results/
          if-no-files-found: ignore
