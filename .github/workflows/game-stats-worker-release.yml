name: Game Stats Worker release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-stats-worker-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Verify rendered browser behavior and visual baselines
    uses: ./.github/workflows/ui-layout.yml

  slow:
    name: Verify full Solitaire deal corpus
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release candidate
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Run full slow-tier tests
        run: npm run test:slow

  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release candidate
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/game-stats/package-lock.json
      - name: Install site dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm ci --prefix workers/game-stats
      - name: Check script and Video Editor syntax
        run: npm run syntax:check
      - name: Run source tests
        run: npm test
      - name: Verify generated integrity metadata
        run: npm run game-stats:integrity:check
      - name: Verify generated app icon manifest
        run: npm run app-icons:check
      - name: Verify generated study resources manifest
        run: npm run study-resources:check
      - name: Verify optimized media derivatives
        run: npm run media:check
      - name: Verify Worker deployment bundle
        run: npm --prefix workers/game-stats run deploy:check

  deploy-worker:
    name: Deploy compatible Worker transition
    needs: [verify, slow, browser]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified release candidate
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/game-stats/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefix workers/game-stats
      - name: Require production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-game-stats-release-context.mjs --credentials
      - name: Reject a superseded workflow revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-game-stats-release-context.mjs --current-main
      - name: Require every secret the Worker configuration declares
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run game-stats:worker-secrets:check
      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Migrations remain compatible with the previous Worker and run before
        # deploy, so the candidate already has the columns and indexes it needs.
        run: npm --prefix workers/game-stats run migrate:remote
      - name: Deploy rollout-compatible Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm --prefix workers/game-stats run deploy --
          --config wrangler.jsonc --strict
      - name: Verify live browser remains accepted by the candidate Worker
        run: npm run game-stats:worker-transition:check
      - name: Verify live Clash Royale data before publishing its UI
        run: npm run clash-royale:deployment:check

  package-pages:
    name: Package verified Pages release
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out Worker-compatible release candidate
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Reject a superseded Pages revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-game-stats-release-context.mjs --current-main
      - name: Configure GitHub Pages
        # actions/configure-pages v5
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Assemble public site artifact
        run: |
          mkdir -p "$RUNNER_TEMP/personal-site/scripts"
          cp -R assets styles video-editor modeling "$RUNNER_TEMP/personal-site/"
          cp -R scripts/home "$RUNNER_TEMP/personal-site/scripts/"
          cp CNAME home.html index.html robots.txt sitemap.xml style.css "$RUNNER_TEMP/personal-site/"
      - name: Upload GitHub Pages artifact
        # actions/upload-pages-artifact v4
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/personal-site

  deploy-pages:
    name: Release synchronized browser and Worker build
    needs: package-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out packaged release revision
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Reject a superseded deployment revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-game-stats-release-context.mjs --current-main
      - name: Deploy verified GitHub Pages artifact
        id: deployment
        # actions/deploy-pages v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify checked-in/deployed browser/Worker release parity
        run: npm run game-stats:release:check
      - name: Verify live Clash Royale data after publication
        run: npm run clash-royale:deployment:check
