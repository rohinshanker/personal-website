name: Browser UI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Layout, behaviour, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install site dependencies
        run: npm ci
      # The browser build is keyed on the lockfile that pins its Playwright
      # version. System packages are not in this cache, so a hit still installs
      # them.
      - name: Restore the Playwright browser cache
        id: playwright-cache
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run browser UI tests
        run: npm run test:ui
      - name: Upload browser UI artifacts
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-artifacts
          path: test-results/
          if-no-files-found: ignore

  visual:
    name: Visual baselines
    # Baselines are committed for linux/arm64, the platform
    # scripts/run-visual-tests.mjs renders in. Keep this runner architecture and
    # that container platform in step.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out source
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      # Browsers and dependencies both come from the pinned container, so the
      # runner installs nothing.
      - name: Run visual baseline tests
        run: npm run test:visual
      - name: Upload visual baseline diffs
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-baseline-diffs
          path: test-results/
          if-no-files-found: ignore
