<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Modeling Portfolio | Rohin Shanker</title>
    <meta
      name="description"
      content="Rohin Shanker's modeling portfolio: runway shows, lookbooks, and promo shoots with full photo galleries and credits."
    />
    <link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon-180.png" sizes="180x180" />
    <link rel="canonical" href="https://rohin.shanker.me/modeling/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rohin OS" />
    <meta property="og:title" content="Rohin Shanker Modeling Portfolio" />
    <meta
      property="og:description"
      content="Runway shows, lookbooks, and promo shoots with full photo galleries and credits."
    />
    <meta property="og:url" content="https://rohin.shanker.me/modeling/" />
    <meta property="og:image" content="https://rohin.shanker.me/assets/optimized/bio-pic-720.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rohin Shanker Modeling Portfolio" />
    <meta
      name="twitter:description"
      content="Runway shows, lookbooks, and promo shoots with full photo galleries and credits."
    />
    <link rel="stylesheet" href="../style.css?v=first-win-stats-handoff-20260722" />
    <link rel="stylesheet" href="style.css?v=modeling-portfolio-download-20260916" />
    <script src="../scripts/home/modeling-portfolio.js?v=modeling-portfolio-digitals-20260921"></script>
    <script src="script.js?v=modeling-portfolio-download-20260916" defer></script>
  </head>
  <body class="modeling-page">
    <a class="skip-link" href="#shoots">Skip to the shoots</a>

    <header class="window portfolio-header" id="top" aria-labelledby="portfolio-title">
      <div class="title-bar">
        <div class="title-bar-text">
          <img
            class="title-bar-icon"
            src="../assets/app-icons/ico/accessibility_window_objs.ico"
            alt=""
          />
          Modeling Portfolio
        </div>
      </div>
      <div class="window-body portfolio-header__body">
        <h1 class="portfolio-title" id="portfolio-title">Rohin Shanker Modeling Portfolio</h1>
        <p class="portfolio-summary">
          Tap or click any photo to view it fullscreen. Press the download button to download the
          current image from the carousel.
        </p>

        <div class="portfolio-links" role="group" aria-label="Portfolio links">
          <a
            class="portfolio-link"
            data-portfolio-instagram
            href="https://www.instagram.com/rrohinss/"
            target="_blank"
            rel="noreferrer"
          >
            <img class="portfolio-link__icon" src="../assets/social-icons/instagram-icon.png" alt="" />
            <span class="portfolio-link__text">
              <span class="portfolio-link__label">Instagram</span>
              <strong class="portfolio-link__value" data-portfolio-instagram-handle>@rrohinss</strong>
            </span>
          </a>
          <div class="portfolio-link-slot" data-portfolio-dropbox="highlights">
            <button
              class="portfolio-link portfolio-link--pending"
              type="button"
              aria-describedby="portfolio-highlights-note"
              disabled
            >
              <img
                class="portfolio-link__icon"
                src="../assets/app-icons/ico/directory_open_file_mydocs.ico"
                alt=""
              />
              <span class="portfolio-link__text">
                <span class="portfolio-link__label">Dropbox</span>
                <strong class="portfolio-link__value">Highlights</strong>
              </span>
            </button>
            <small class="portfolio-link__note" id="portfolio-highlights-note">Link coming soon</small>
          </div>
          <div class="portfolio-link-slot" data-portfolio-dropbox="digitals">
            <button
              class="portfolio-link portfolio-link--pending"
              type="button"
              aria-describedby="portfolio-digitals-note"
              disabled
            >
              <img
                class="portfolio-link__icon"
                src="../assets/app-icons/ico/directory_open_file_mydocs.ico"
                alt=""
              />
              <span class="portfolio-link__text">
                <span class="portfolio-link__label">Dropbox</span>
                <strong class="portfolio-link__value">Digitals</strong>
              </span>
            </button>
            <small class="portfolio-link__note" id="portfolio-digitals-note">Link coming soon</small>
          </div>
        </div>

        <nav class="portfolio-nav" aria-label="Shoots">
          <details class="portfolio-nav__details">
            <summary class="portfolio-nav__summary" data-portfolio-nav-summary>Jump to a shoot</summary>
            <ol class="portfolio-nav__list" data-portfolio-nav-list></ol>
          </details>
        </nav>

        <p class="portfolio-home">
          <a class="portfolio-home__link" href="/">Back to Rohin OS</a>
        </p>
      </div>
    </header>

    <main class="portfolio-shoots" id="shoots" data-portfolio-shoots aria-label="Shoots">
      <noscript>
        <div class="window portfolio-noscript">
          <div class="title-bar"><div class="title-bar-text">JavaScript required</div></div>
          <div class="window-body">
            <p>The galleries need JavaScript. Enable it and reload to see the shoots.</p>
          </div>
        </div>
      </noscript>
    </main>

    <a class="portfolio-top-link" href="#top" data-portfolio-top hidden>Top</a>
  </body>
</html>
