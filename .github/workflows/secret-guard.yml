name: Secret guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository-guard:
    name: Check source files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-no-secrets.mjs
      - run: node --test tests/no-secrets.test.mjs
  gitleaks:
    name: Scan reachable Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
